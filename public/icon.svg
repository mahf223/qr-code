<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Glowing Scanner Grid / QR Frame -->
  <g transform="translate(64, 64)" filter="url(#glow)">
    <!-- Top-Left Finder Eye Outer -->
    <rect x="24" y="24" width="108" height="108" rx="28" fill="none" stroke="url(#accentGrad)" stroke-width="22"/>
    <!-- Top-Left Finder Eye Inner -->
    <circle cx="78" cy="78" r="24" fill="#38bdf8"/>

    <!-- Top-Right Finder Eye Outer -->
    <rect x="252" y="24" width="108" height="108" rx="28" fill="none" stroke="url(#accentGrad)" stroke-width="22"/>
    <!-- Top-Right Finder Eye Inner -->
    <circle cx="306" cy="78" r="24" fill="#6366f1"/>

    <!-- Bottom-Left Finder Eye Outer -->
    <rect x="24" y="252" width="108" height="108" rx="28" fill="none" stroke="url(#accentGrad)" stroke-width="22"/>
    <!-- Bottom-Left Finder Eye Inner -->
    <circle cx="78" cy="306" r="24" fill="#a855f7"/>

    <!-- Data matrix dots and modules -->
    <rect x="160" y="36" width="30" height="30" rx="8" fill="url(#accentGrad)"/>
    <rect x="202" y="36" width="22" height="22" rx="6" fill="#38bdf8"/>
    <rect x="160" y="80" width="22" height="52" rx="8" fill="#6366f1"/>
    <rect x="194" y="90" width="30" height="42" rx="8" fill="url(#accentGrad)"/>

    <rect x="36" y="160" width="50" height="24" rx="8" fill="#38bdf8"/>
    <rect x="98" y="160" width="34" height="34" rx="8" fill="url(#accentGrad)"/>
    <rect x="36" y="196" width="32" height="32" rx="8" fill="#6366f1"/>

    <!-- Center QR Hub / AI Sparkle Icon -->
    <g transform="translate(152, 152)">
      <rect width="80" height="80" rx="24" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="6"/>
      <path d="M40 18 L44 34 L60 38 L44 42 L40 58 L36 42 L20 38 L36 34 Z" fill="#fbbf24"/>
      <circle cx="58" cy="22" r="4" fill="#38bdf8"/>
    </g>

    <!-- Bottom-right elements -->
    <rect x="252" y="160" width="36" height="36" rx="8" fill="#6366f1"/>
    <rect x="300" y="160" width="60" height="24" rx="8" fill="url(#accentGrad)"/>
    <rect x="252" y="208" width="52" height="24" rx="8" fill="#38bdf8"/>
    <rect x="316" y="196" width="44" height="44" rx="10" fill="#a855f7"/>

    <rect x="160" y="252" width="24" height="60" rx="8" fill="#38bdf8"/>
    <rect x="196" y="252" width="30" height="30" rx="8" fill="url(#accentGrad)"/>
    <rect x="196" y="294" width="30" height="66" rx="8" fill="#6366f1"/>

    <rect x="252" y="260" width="48" height="48" rx="12" fill="url(#accentGrad)"/>
    <rect x="312" y="260" width="48" height="24" rx="6" fill="#38bdf8"/>
    <rect x="252" y="320" width="34" height="40" rx="8" fill="#6366f1"/>
    <rect x="298" y="296" width="62" height="64" rx="16" fill="url(#accentGrad)"/>

    <!-- Laser Line across center -->
    <rect x="10" y="190" width="364" height="4" rx="2" fill="url(#laserGrad)"/>
  </g>
</svg>
